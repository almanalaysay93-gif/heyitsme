<!doctype html>
<html lang="en" data-resolution="landscape">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #080b18; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 72% 45%, #30246b 0%, #151531 30%, #090d1b 70%); }
    .clip { position: absolute; inset: 0; overflow: hidden; }
    .glow { position: absolute; border-radius: 50%; pointer-events: none; }
    .glow.violet { width: 1160px; height: 900px; left: 44%; top: -8%; background: radial-gradient(circle, rgba(123,80,255,.35), transparent 62%); }
    .glow.cyan { width: 1100px; height: 840px; left: 54%; top: 33%; background: radial-gradient(circle, rgba(51,230,233,.16), transparent 68%); }
    .grid { position: absolute; left: 20%; right: -20%; bottom: -60%; height: 110%; background-image: linear-gradient(rgba(127,150,245,.13) 1px, transparent 1px), linear-gradient(90deg, rgba(127,150,245,.13) 1px, transparent 1px); background-size: 94px 94px; transform: perspective(650px) rotateX(65deg); transform-origin: 50% 0; -webkit-mask-image: linear-gradient(transparent 5%, #000 60%); mask-image: linear-gradient(transparent 5%, #000 60%); }
    .chamber { position: absolute; width: 1000px; height: 1000px; left: 47%; top: 3%; perspective: 1200px; transform-style: preserve-3d; }
    .orbit-plane { position: absolute; inset: 10%; transform: rotateX(65deg) rotateY(-16deg); transform-style: preserve-3d; }
    .orbit { position: absolute; inset: 0; border-radius: 50%; transform-style: preserve-3d; }
    .orbit::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: conic-gradient(from 30deg, transparent 0 9%, rgba(100,224,255,.85) 15%, rgba(211,222,255,.9) 17%, transparent 22% 38%, rgba(126,94,255,.95) 45%, transparent 51% 69%, rgba(255,154,112,.8) 76%, transparent 82%); -webkit-mask: radial-gradient(transparent 62%, #000 63% 65%, transparent 66%); mask: radial-gradient(transparent 62%, #000 63% 65%, transparent 66%); filter: drop-shadow(0 0 22px rgba(108,104,255,.8)); }
    .orbit-a { inset: 0; }
    .orbit-b { inset: 10%; }
    .orbit-b::before { background: conic-gradient(from 0deg, rgba(170,244,255,.9), transparent 13% 25%, rgba(126,94,255,.8) 31%, transparent 42% 70%, rgba(255,255,255,.85) 76%, transparent 84%); -webkit-mask: radial-gradient(transparent 70%, #000 71% 73%, transparent 74%); mask: radial-gradient(transparent 70%, #000 71% 73%, transparent 74%); }
    .orbit-c { inset: 22%; }
    .orbit-c::before { background: conic-gradient(from 100deg, transparent 0 15%, rgba(94,236,233,.92) 20%, transparent 27% 52%, rgba(255,159,129,.92) 59%, transparent 66%); -webkit-mask: radial-gradient(transparent 74%, #000 75% 78%, transparent 79%); mask: radial-gradient(transparent 74%, #000 75% 78%, transparent 79%); }
    .aperture { position: absolute; inset: 37%; border-radius: 50%; background: radial-gradient(circle, rgba(166,214,255,.8), rgba(99,74,234,.65) 17%, rgba(14,16,48,.9) 53%, transparent 69%); box-shadow: 0 0 120px 42px rgba(99,70,249,.28), inset 0 0 60px rgba(115,214,255,.45); }
    .shard { position: absolute; width: 90px; height: 160px; border: 1px solid rgba(255,255,255,.56); border-radius: 12px; background: linear-gradient(145deg, rgba(185,225,255,.7), rgba(120,94,245,.12) 33%, rgba(27,33,82,.72) 76%, rgba(242,248,255,.45)); box-shadow: inset 0 1px rgba(255,255,255,.72), 0 22px 50px rgba(11,16,54,.6), 0 0 36px rgba(126,111,255,.4); backdrop-filter: blur(8px); }
    .shard.one { left: 12%; top: 31%; }
    .shard.two { right: 16%; top: 16%; width: 46px; height: 120px; }
    .shard.three { right: 13%; bottom: 17%; width: 54px; height: 92px; }
    .beam { position: absolute; left: 41%; top: 48%; width: 820px; height: 2px; transform-origin: left center; background: linear-gradient(90deg, transparent, rgba(186,238,255,.9), transparent); box-shadow: 0 0 30px rgba(107,222,255,.9); }
    .grain { position: absolute; inset: 0; opacity: .13; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E"); }
    .left-veil { position: absolute; inset: 0; background: linear-gradient(90deg, #080b18 0%, rgba(8,11,24,.96) 27%, rgba(8,11,24,.28) 67%, transparent); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="heyitsme-hero" data-start="0" data-duration="6" data-width="1920" data-height="1080">
    <div id="hero-orbit-scene" class="clip" data-start="0" data-duration="6" data-track-index="0">
      <div class="glow violet" data-layout-allow-overflow></div><div class="glow cyan" data-layout-allow-overflow></div><div class="grid" data-layout-allow-overflow></div>
      <div class="chamber">
        <div class="orbit-plane"><div class="orbit orbit-a"></div><div class="orbit orbit-b"></div><div class="orbit orbit-c"></div><div class="aperture"></div></div>
        <div class="shard one"></div><div class="shard two"></div><div class="shard three"></div>
      </div>
      <div class="beam"></div><div class="left-veil"></div><div class="grain"></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(".orbit-a", { rotation: 0 }, { rotation: 360, duration: 6, ease: "none" }, 0);
    tl.fromTo(".orbit-b", { rotation: 360 }, { rotation: 0, duration: 6, ease: "none" }, 0);
    tl.fromTo(".orbit-c", { rotation: 0 }, { rotation: 360, duration: 6, ease: "none" }, 0);
    tl.fromTo(".shard.one", { x: -26, y: 8 }, { x: 26, y: -8, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
    tl.fromTo(".shard.two", { x: 10, y: -20 }, { x: -10, y: 20, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
    tl.fromTo(".shard.three", { x: -20, y: 12 }, { x: 20, y: -12, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
    tl.fromTo(".beam", { x: -260, opacity: 0, rotation: -24 }, { x: 180, opacity: .65, rotation: -24, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
    window.__timelines["heyitsme-hero"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
