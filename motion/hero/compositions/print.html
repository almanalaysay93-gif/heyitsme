<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
</head>
<body>
  <template>
    <style>
      #root { position: absolute; inset: 0; overflow: hidden; background: #0c0e16; font-family: sans-serif; color: #f4f1ea; }
      .rig { position: absolute; inset: 0; perspective: 1400px; }
      .card { position: absolute; left: 600px; top: 280px; width: 720px; height: 460px; background: #161822; border: 2px solid #9adbd4; }
      .name, .co, .role, .url { margin: 0; }
      .name { position: absolute; left: 48px; top: 56px; font-size: 64px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.95; }
      .role { position: absolute; left: 48px; top: 140px; font-size: 26px; font-weight: 700; }
      .co { position: absolute; left: 48px; top: 178px; font-size: 26px; font-weight: 700; color: #9adbd4; }
      .qr { position: absolute; right: 48px; bottom: 108px; display: grid; grid-template-columns: repeat(7, 14px); gap: 3px; }
      .qr i { width: 14px; height: 14px; background: transparent; }
      .qr i.on { background: #f4f1ea; }
      .chip { position: absolute; left: 48px; bottom: 108px; padding: 12px 18px; background: #9adbd4; color: #0c0e16; font-size: 22px; font-weight: 800; }
      .url { position: absolute; left: 48px; right: 48px; bottom: 40px; }
      .wipe { display: block; padding: 10px 14px; background: #f4f1ea; color: #0c0e16; font-size: 26px; font-weight: 800; }
      .slash { position: absolute; top: 48%; left: 0; width: 36%; height: 4px; background: #8b7cff; }
    </style>
    <div id="root" data-composition-id="heyitsme-print" data-width="1920" data-height="1080" data-duration="3.8">
      <div class="slash"></div>
      <div class="rig">
        <div class="card">
          <p class="name">Alex Morgan</p>
          <p class="role">Creative director</p>
          <p class="co">Studio North</p>
          <div class="qr" aria-hidden="true">
            <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
            <i class="on"></i><i></i><i></i><i></i><i></i><i></i><i class="on"></i>
            <i class="on"></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i class="on"></i>
            <i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i><i></i><i class="on"></i>
            <i class="on"></i><i></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i class="on"></i>
            <i class="on"></i><i></i><i></i><i></i><i></i><i></i><i class="on"></i>
            <i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i>
          </div>
          <div class="chip">Saved</div>
          <p class="url"><span class="wipe">heyitsme.fyi/c/demo</span></p>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set(".card", { x: 0, rotateY: 8 }, 0);
      tl.fromTo(".slash", { x: -480, opacity: 0 }, { x: 1500, opacity: 0.8, duration: 0.7, ease: "none" }, 0.35);
      tl.to(".slash", { opacity: 0, duration: 0.15 }, 1.05);
      tl.fromTo(".qr", { y: -24, scale: 0.92, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.2);
      tl.fromTo(".chip", { x: 16, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 1.45);
      tl.fromTo(".wipe", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power2.inOut" }, 2.3);
      window.__timelines = window.__timelines || {};
      window.__timelines["heyitsme-print"] = tl;
    </script>
  </template>
</body>
</html>
